{% extends "base.html" %}

{% block title %}400 Bad Request{% endblock %}

{% block content %}
<div class="container py-5 text-center">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card-saas p-5">
        <div class="text-danger mb-3">
          <i class="fa-solid fa-circle-exclamation fa-4x"></i>
        </div>
        <h1 class="h3 fw-bold text-dark mb-2">Bad Request (400)</h1>
        <p class="text-muted mb-4">
          The request could not be understood or was missing required parameters.
        </p>
        <div>
          <a href="{% url 'accounts:dashboard_router' %}" class="btn btn-saas-primary">
            <i class="fa-solid fa-house me-2"></i> Return to Dashboard
          </a>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
