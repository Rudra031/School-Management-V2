<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>500 Internal Server Error | SMS</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    body { background-color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
    .error-card { background: #fff; border: 1px solid #e2e8f0; border-radius: 12px; padding: 2.5rem; max-width: 520px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
  </style>
</head>
<body>
  <div class="error-card">
    <div class="text-danger mb-3">
      <i class="fa-solid fa-triangle-exclamation fa-4x"></i>
    </div>
    <h1 class="h4 fw-bold text-dark mb-2">Unexpected Server Error (500)</h1>
    <p class="text-muted small mb-4">
      An unexpected internal server error occurred. The system technical team has logged this incident. Please try again in a few moments.
    </p>
    <a href="/accounts/dashboard/" class="btn btn-primary px-4 py-2">
      <i class="fa-solid fa-house me-2"></i> Back to Safety
    </a>
  </div>
</body>
</html>
