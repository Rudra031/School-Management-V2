{% extends "base.html" %}

{% block title %}404 Page Not Found{% endblock %}

{% block content %}
<div class="container py-5 text-center">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card-saas p-5">
        <div class="text-warning mb-3">
          <i class="fa-solid fa-compass-drafting fa-4x"></i>
        </div>
        <h1 class="h3 fw-bold text-dark mb-2">Page Not Found (404)</h1>
        <p class="text-muted mb-4">
          The page or record you are looking for does not exist, has been archived, or the URL is incorrect.
        </p>
        <div>
          <a href="{% url 'accounts:dashboard_router' %}" class="btn btn-saas-primary">
            <i class="fa-solid fa-house me-2"></i> Return to Dashboard
          </a>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
