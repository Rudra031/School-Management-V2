{% extends "base.html" %}

{% block title %}Confirm Delete Section | Horizon School{% endblock %}

{% block content %}
<div class="row justify-content-center py-4">
  <div class="col-md-6 col-lg-5">
    <div class="card shadow-sm border-0 rounded-4 p-4 text-center bg-white">
      <div class="d-inline-flex align-items-center justify-content-center mx-auto mb-3" style="width:60px; height:60px; border-radius:50%; background:#fee2e2; color:#ef4444; font-size:1.8rem;">
        <i class="fa-solid fa-triangle-exclamation"></i>
      </div>
      <h4 class="fw-bold text-dark mb-2">Remove Section</h4>
      <p class="text-muted small mb-4">
        Are you sure you want to remove <strong>"{{ object.full_name }}"</strong>?
      </p>

      <form method="post">
        {% csrf_token %}
        <div class="d-flex justify-content-center gap-2">
          <a href="{% url 'academics:class_manage' %}" class="btn btn-light px-4 fw-semibold rounded-3">Cancel</a>
          <button type="submit" class="btn btn-danger px-4 fw-bold rounded-3">
            <i class="fa-solid fa-trash-can me-1"></i> Yes, Remove Section
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
