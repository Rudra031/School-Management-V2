version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: horizon_postgres_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-horizon_school_db}
      POSTGRES_USER: ${DB_USER:-horizon_admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-SecureDatabasePassword2026!}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-horizon_admin} -d ${DB_NAME:-horizon_school_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: horizon_web_app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    volumes:
      - media_data:/app/media
      - static_data:/app/staticfiles
    ports:
      - "8000:8000"

  nginx:
    image: nginx:alpine
    container_name: horizon_nginx_proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_data:/app/staticfiles:ro
      - media_data:/app/media:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      - web

volumes:
  pgdata:
  static_data:
  media_data:
